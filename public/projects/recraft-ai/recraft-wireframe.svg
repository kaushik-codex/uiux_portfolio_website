<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(34, 197, 94, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="640" rx="28" fill="url(#bgWire)" stroke="#15803D" stroke-width="2" />
  <rect width="360" height="640" rx="28" fill="url(#gridPattern)" />

  <!-- Status Bar Blueprint -->
  <rect x="24" y="16" width="312" height="18" rx="4" fill="none" stroke="#22C55E" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
  <text x="32" y="29" fill="#22C55E" font-family="monospace" font-size="10" opacity="0.8">09:41 // SYSTEM RE-CRAFT v2.6</text>
  <circle cx="320" cy="25" r="4" fill="#22C55E" opacity="0.8" />

  <!-- App Header Blueprint -->
  <rect x="20" y="48" width="320" height="40" rx="6" fill="#15803D" fill-opacity="0.15" stroke="#22C55E" stroke-width="1.2" />
  <text x="34" y="73" fill="#4ADE80" font-family="sans-serif" font-weight="bold" font-size="14">ReCraft AI // UX FLOW WIREFRAME</text>

  <!-- Step 1: Capture Phase -->
  <g transform="translate(20, 102)">
    <rect width="320" height="88" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#22C55E" stroke-width="1.2" />
    <circle cx="28" cy="24" r="12" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-width="1.5" />
    <text x="24" y="28" fill="#4ADE80" font-family="monospace" font-size="11" font-weight="bold">1</text>
    <text x="50" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Capture User Flow (Thumb Zone)</text>
    <text x="50" y="44" fill="#86EFAC" font-family="monospace" font-size="10">Camera / Gallery Intent Triggers</text>
    
    <!-- Wireframe Buttons -->
    <rect x="50" y="54" width="120" height="24" rx="4" fill="none" stroke="#22C55E" stroke-width="1" stroke-dasharray="3 2" />
    <text x="64" y="69" fill="#86EFAC" font-family="monospace" font-size="9">[ Upload Image ]</text>

    <rect x="180" y="54" width="120" height="24" rx="4" fill="#22C55E" fill-opacity="0.3" stroke="#22C55E" stroke-width="1" />
    <text x="194" y="69" fill="#FFFFFF" font-family="monospace" font-size="9">[ Take Photo ]</text>
  </g>

  <!-- Flow Connector 1 -->
  <path d="M 180 190 L 180 210" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="176,208 184,208 180,214" fill="#22C55E" />

  <!-- Step 2: Verification UI & Confidence Tagging -->
  <g transform="translate(20, 218)">
    <rect width="320" height="116" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#22C55E" stroke-width="1.2" />
    <circle cx="28" cy="24" r="12" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-width="1.5" />
    <text x="24" y="28" fill="#4ADE80" font-family="monospace" font-size="11" font-weight="bold">2</text>
    <text x="50" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Real-Time Object Classification</text>
    <text x="50" y="44" fill="#86EFAC" font-family="monospace" font-size="10">High Confidence Status Badging</text>

    <!-- Tag Rows -->
    <rect x="50" y="54" width="250" height="22" rx="4" fill="#14532D" stroke="#22C55E" stroke-width="0.8" />
    <text x="58" y="69" fill="#F0FDF4" font-family="monospace" font-size="10">Alarm Clock</text>
    <rect x="236" y="58" width="58" height="14" rx="3" fill="#22C55E" />
    <text x="242" y="69" fill="#052E16" font-family="monospace" font-size="8" font-weight="bold">99.9% HIGH</text>

    <rect x="50" y="82" width="250" height="22" rx="4" fill="none" stroke="#22C55E" stroke-width="0.8" opacity="0.6" />
    <text x="58" y="97" fill="#86EFAC" font-family="monospace" font-size="10">Analog Dial Clock</text>
    <rect x="236" y="86" width="58" height="14" rx="3" fill="#22C55E" opacity="0.8" />
    <text x="242" y="97" fill="#052E16" font-family="monospace" font-size="8" font-weight="bold">99.8% HIGH</text>
  </g>

  <!-- Flow Connector 2 -->
  <path d="M 180 334 L 180 354" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="176,352 184,352 180,358" fill="#22C55E" />

  <!-- Step 3: Structured Data Hierarchy (Ideas) -->
  <g transform="translate(20, 362)">
    <rect width="320" height="136" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#22C55E" stroke-width="1.2" />
    <circle cx="28" cy="24" r="12" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-width="1.5" />
    <text x="24" y="28" fill="#4ADE80" font-family="monospace" font-size="11" font-weight="bold">3</text>
    <text x="50" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Structured Recipe Architecture</text>
    
    <!-- Compartments -->
    <rect x="50" y="44" width="250" height="40" rx="6" fill="#052E16" stroke="#22C55E" stroke-width="0.8" />
    <text x="58" y="60" fill="#4ADE80" font-family="monospace" font-size="9" font-weight="bold">PROJECT: VINTAGE VINYL CLOCK</text>
    <text x="58" y="74" fill="#BBF7D0" font-family="monospace" font-size="8.5">• Materials: Vinyl plate, Kit, Adhesive</text>

    <!-- Step Items -->
    <rect x="50" y="92" width="250" height="32" rx="4" fill="none" stroke="#22C55E" stroke-width="0.8" stroke-dasharray="4 2" />
    <text x="58" y="106" fill="#86EFAC" font-family="monospace" font-size="8.5">STEP 01: Disassemble alarm mechanism</text>
    <text x="58" y="118" fill="#86EFAC" font-family="monospace" font-size="8.5">STEP 02: Mount spindle into central hole</text>
  </g>

  <!-- Flow Connector 3 -->
  <path d="M 180 498 L 180 518" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="176,516 184,516 180,522" fill="#22C55E" />

  <!-- Step 4: Visual Verification & Mockup Generation -->
  <g transform="translate(20, 526)">
    <rect width="320" height="76" rx="10" fill="#064E3B" fill-opacity="0.4" stroke="#22C55E" stroke-width="1.4" />
    <circle cx="28" cy="24" r="12" fill="#22C55E" fill-opacity="0.3" stroke="#22C55E" stroke-width="1.5" />
    <text x="24" y="28" fill="#4ADE80" font-family="monospace" font-size="11" font-weight="bold">4</text>
    <text x="50" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Visualize Upcycled Result</text>
    <text x="50" y="44" fill="#86EFAC" font-family="monospace" font-size="10">High-Resolution Model Preview</text>
    <rect x="50" y="52" width="250" height="16" rx="4" fill="#22C55E" fill-opacity="0.25" />
    <text x="110" y="64" fill="#4ADE80" font-family="monospace" font-size="9">[ PREVIEW RENDER COMPLETE ]</text>
  </g>

  <!-- Bottom Navigation Wireframe -->
  <rect x="20" y="612" width="320" height="20" rx="4" fill="#052E16" stroke="#22C55E" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  <text x="50" y="626" fill="#22C55E" font-family="monospace" font-size="9">NAV [HOME]</text>
  <text x="160" y="626" fill="#22C55E" font-family="monospace" font-size="9">NAV [SAVED]</text>
  <text x="260" y="626" fill="#22C55E" font-family="monospace" font-size="9">NAV [ABOUT]</text>
</svg>
