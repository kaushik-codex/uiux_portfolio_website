<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="800" rx="36" fill="url(#bgGrad)"/>
  <rect width="396" height="796" x="2" y="2" rx="34" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="34" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">14:20</text>
  <circle cx="340" cy="30" r="4" fill="#10B981"/>
  <rect x="352" y="26" width="22" height="10" rx="3" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="354" y="28" width="14" height="6" rx="1.5" fill="#94A3B8"/>

  <!-- Top Location / Brand Header -->
  <g transform="translate(24, 52)">
    <text x="0" y="14" fill="#F97316" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DELIVER TO</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="18" font-weight="800">742 Evergreen Terrace</text>
    <circle cx="320" cy="24" r="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M315 24 h10 M320 19 v10" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Search Input Module -->
  <g transform="translate(24, 115)">
    <rect width="352" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <line x1="28.5" y1="28.5" x2="34" y2="34" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="29" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="14">Dishes, restaurants, or cuisines...</text>
  </g>

  <!-- High-Visibility Promotional Banner -->
  <g transform="translate(24, 180)">
    <rect width="352" height="140" rx="20" fill="url(#bannerGrad)"/>
    <text x="24" y="42" fill="#FFFFFF" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SPECIAL CURATION</text>
    <text x="24" y="74" fill="#FFFFFF" font-family="-apple-system, Inter, sans-serif" font-size="24" font-weight="900">Artisan Truffle Burgers</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.85)" font-family="-apple-system, Inter, sans-serif" font-size="13">Free expedited delivery on all first orders</text>
    <rect x="24" y="110" width="80" height="20" rx="10" fill="#FFFFFF"/>
    <text x="40" y="124" fill="#EA580C" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700">CLAIM 30%</text>
  </g>

  <!-- Horizontal Thumb Filters (Pizza, Burger, Asian, etc.) -->
  <g transform="translate(24, 340)">
    <!-- Tag 1: Active All -->
    <rect x="0" y="0" width="60" height="36" rx="18" fill="#F97316"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700">All</text>

    <!-- Tag 2: Pizza -->
    <rect x="68" y="0" width="84" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="84" y="22" fill="#E2E8F0" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">🍕 Pizza</text>

    <!-- Tag 3: Burger -->
    <rect x="160" y="0" width="90" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="176" y="22" fill="#E2E8F0" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">🍔 Burger</text>

    <!-- Tag 4: Sushi -->
    <rect x="258" y="0" width="84" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="274" y="22" fill="#E2E8F0" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">🍣 Sushi</text>
  </g>

  <!-- Featured Restaurant Marketplace Card -->
  <g transform="translate(24, 396)">
    <rect width="352" height="270" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Image Header Area -->
    <rect width="352" height="150" rx="20" fill="#334155"/>
    <path d="M0 20 Q0 0 20 0 L332 0 Q352 0 352 20 L352 150 L0 150 Z" fill="#1E293B"/>
    <!-- Mock Plate / Burger Visual -->
    <circle cx="176" cy="75" r="50" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <text x="156" y="85" font-size="32">🍔</text>
    
    <!-- Badges on Image -->
    <rect x="16" y="16" width="60" height="24" rx="12" fill="rgba(15, 23, 42, 0.85)"/>
    <text x="26" y="32" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700">★ 4.9</text>

    <rect x="248" y="16" width="88" height="24" rx="12" fill="rgba(15, 23, 42, 0.85)"/>
    <text x="258" y="32" fill="#38BDF8" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="700">⏱ 15-20 min</text>

    <!-- Card Content -->
    <text x="20" y="184" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="18" font-weight="800">The Gourmet Bistro & Grill</text>
    <text x="20" y="206" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="12">American • Gourmet Burgers • Craft Shakes • $$</text>
    
    <line x1="20" y1="222" x2="332" y2="222" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="246" fill="#10B981" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">🛵 Free Delivery above $25</text>
    <circle cx="316" cy="242" r="14" fill="#F97316"/>
    <path d="M312 242 h8 M316 238 v8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Persistent Bottom Tracking & Navigation Bar -->
  <g transform="translate(0, 715)">
    <rect width="400" height="85" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <!-- Nav item 1: Discover -->
    <g transform="translate(50, 18)">
      <circle cx="12" cy="12" r="16" fill="rgba(249, 115, 22, 0.15)"/>
      <circle cx="12" cy="12" r="6" fill="#F97316"/>
      <text x="12" y="36" fill="#F97316" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Explore</text>
    </g>
    <!-- Nav item 2: Orders -->
    <g transform="translate(150, 18)">
      <rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="#64748B" stroke-width="2"/>
      <text x="12" y="36" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Orders</text>
    </g>
    <!-- Nav item 3: Favorites -->
    <g transform="translate(250, 18)">
      <path d="M12 6 l2 5 h5 l-4 3 l2 5 l-5 -3 l-5 3 l2 -5 l-4 -3 h5 z" fill="none" stroke="#64748B" stroke-width="1.8"/>
      <text x="12" y="36" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Saved</text>
    </g>
    <!-- Nav item 4: Profile -->
    <g transform="translate(350, 18)">
      <circle cx="12" cy="9" r="5" fill="none" stroke="#64748B" stroke-width="2"/>
      <path d="M4 22 C4 17 8 16 12 16 C16 16 20 17 20 22" fill="none" stroke="#64748B" stroke-width="2"/>
      <text x="12" y="36" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>
