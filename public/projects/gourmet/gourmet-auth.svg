<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="400" height="800" rx="36" fill="url(#authBg)"/>
  <rect width="396" height="796" x="2" y="2" rx="34" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Back button -->
  <circle cx="44" cy="54" r="18" fill="#1E293B"/>
  <path d="M48 48 L42 54 L48 60" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>

  <!-- Gourmet Monogram Brand -->
  <g transform="translate(44, 110)">
    <rect width="48" height="48" rx="14" fill="#F97316"/>
    <text x="14" y="34" fill="#FFFFFF" font-family="-apple-system, Inter, sans-serif" font-size="24" font-weight="900">G</text>
    <text x="64" y="28" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="800">Gourmet</text>
    <text x="64" y="44" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="12">Fast food discovery & delivery</text>
  </g>

  <!-- Title -->
  <g transform="translate(44, 210)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="28" font-weight="800">Welcome Back</text>
    <text x="0" y="26" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="14">Enter your credentials to continue ordering</text>
  </g>

  <!-- Email Input Field -->
  <g transform="translate(44, 275)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">EMAIL ADDRESS</text>
    <rect y="10" width="312" height="52" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="18" y="42" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="15">alex.morgan@design.io</text>
  </g>

  <!-- Password Input Field with Inline Visibility Modifier Eye -->
  <g transform="translate(44, 365)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600">PASSWORD</text>
    <rect y="10" width="312" height="52" rx="14" fill="#1E293B" stroke="#F97316" stroke-width="1.5"/>
    <text x="18" y="44" fill="#F8FAFC" font-family="-apple-system, Inter, sans-serif" font-size="20" letter-spacing="4">••••••••••••</text>
    
    <!-- Inline Password Visibility Modifier Eye -->
    <g transform="translate(272, 26)">
      <circle cx="12" cy="10" r="4" fill="#F97316"/>
      <path d="M2 10 Q12 2 22 10 Q12 18 2 10 Z" fill="none" stroke="#F97316" stroke-width="2"/>
    </g>
  </g>

  <!-- Remember & Forgot Password -->
  <g transform="translate(44, 450)">
    <rect width="18" height="18" rx="5" fill="#F97316"/>
    <path d="M5 9 L8 12 L13 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="26" y="14" fill="#94A3B8" font-family="-apple-system, Inter, sans-serif" font-size="13">Remember me</text>
    <text x="220" y="14" fill="#F97316" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600">Forgot Password?</text>
  </g>

  <!-- Sign In Button -->
  <g transform="translate(44, 495)">
    <rect width="312" height="54" rx="16" fill="url(#btnGrad)"/>
    <text x="120" y="34" fill="#FFFFFF" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="700">Sign In</text>
  </g>

  <!-- Social Divider -->
  <g transform="translate(44, 590)">
    <line x1="0" y1="0" x2="130" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="144" y="4" fill="#64748B" font-family="-apple-system, Inter, sans-serif" font-size="12">OR</text>
    <line x1="182" y1="0" x2="312" y2="0" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Fast One-Tap Auth Pills -->
  <g transform="translate(44, 620)">
    <rect x="0" y="0" width="148" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="44" y="29" fill="#E2E8F0" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600">Google</text>
    
    <rect x="164" y="0" width="148" height="48" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="210" y="29" fill="#E2E8F0" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600">Apple</text>
  </g>
</svg>
